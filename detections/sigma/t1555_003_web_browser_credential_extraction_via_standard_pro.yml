title: Web Browser Credential Extraction via Standard Process Access
id: 8f4c1e2a-3b5d-4e8c-9a1b-2c3d4e5f6a7b
status: experimental
description: Detects suspicious process access to web browsers from unrelated processes to extract stored credentials. Attackers commonly abuse legitimate browser APIs or direct memory access to steal passwords and session tokens. This detection focuses on cross-browser credential harvesting attempts.
logsource:
  product: windows
  category: image_load
detection:
  selection_browser:
    TargetImage|contains:
      - '\chrome.exe'
      - '\chromeupdater.exe'
      - '\msedge.exe'
      - '\firefox.exe'
      - '\iexplore.exe'
      - '\opera.exe'
      - '\safari.exe'
  selection_image:
    Image|contains:
      - '\taskmgr.exe'
      - '\procexp.exe'
      - '\processhacker.exe'
      - '\powershell.exe'
      - '\cmd.exe'
      - '\python.exe'
      - '\ruby.exe'
  condition: selection_browser and selection_image
falsepositives:
  - IT administrators using Sysinternals tools for browser troubleshooting
  - Legitimate software vendors querying browser for integration checks
  - Security tools scanning browser processes for inventory
  - Users running browser extensions with elevated privileges
level: high
tags:
  - attack.credential_access
  - attack.t1555.003
