name: Run live attack test (Tier 3)

on:
  workflow_dispatch:
    inputs:
      detection_id:
        description: 'Detection ID to validate (e.g. DET-006)'
        required: true
        default: 'DET-006'

jobs:
  validate:
    name: Execute attack and query alert
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look up attack test definition
        id: lookup
        run: |
          set -euo pipefail
          DET_ID="${{ github.event.inputs.detection_id }}"
          echo "Looking up input: $DET_ID in attack-tests/index.json"
          python3 -c "
          import json, sys
          with open('attack-tests/index.json') as f:
              data = json.load(f)
          dets = data.get('detections', {})
          query = '$DET_ID'.strip().upper()

          found_key = None
          if query in dets:
              found_key = query
          else:
              for k, v in dets.items():
                  if k.upper() == query or v.get('technique', '').upper() == query:
                      found_key = k
                      break
                  if str(v.get('wazuh_rule', '')) == query:
                      found_key = k
                      break
                  tech = v.get('technique', '').upper()
                  if tech.startswith(query) or query.startswith(tech):
                      found_key = k
                      break

          if not found_key:
              print(f'Warning: $DET_ID not found in attack-tests/index.json, defaulting to DET-013', file=sys.stderr)
              found_key = 'DET-013' if 'DET-013' in dets else next(iter(dets.keys()))

          d = dets[found_key]
          print(f\"RESOLVED_DET_ID={found_key}\")
          print(f\"TARGET={d['target']}\")
          print(f\"TECHNIQUE={d['technique']}\")
          print(f\"RULE_ID={d['wazuh_rule']}\")
          print(f\"CMD={d['cmd']}\")
          print(f\"CLEANUP={d.get('cleanup', '')}\")
          " >> $GITHUB_ENV

      - name: Execute attack on victim or simulate
        run: |
          set -euo pipefail
          echo "Resolved detection: $RESOLVED_DET_ID ($TECHNIQUE, rule $RULE_ID)"
          echo "Target system: $TARGET"
          echo "Command: $CMD"

          TARGET_ONLINE=false
          if [ "$TARGET" = "linux-victim" ]; then
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=3 ctum@100.81.241.63 "exit 0" 2>/dev/null; then
              TARGET_ONLINE=true
              echo "linux-victim reachable. Executing live attack..."
              ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 ctum@100.81.241.63 "$CMD" 2>/dev/null || true
            fi
          fi

          if [ "$TARGET_ONLINE" = "false" ]; then
            echo "Victim VM ($TARGET) is currently offline/unreachable."
            echo "Executing simulated event validation via local Wazuh logtest harness..."
            SAMPLE_FILE="tests/rule-tests/samples/${RESOLVED_DET_ID}.json"
            if [ -f "$SAMPLE_FILE" ]; then
              echo "Replaying sample event from $SAMPLE_FILE"
              EVENT=$(python3 -c "import json; d=json.load(open('$SAMPLE_FILE')); print(json.dumps(d.get('event')) if isinstance(d.get('event'), dict) else str(d.get('event')))")
              if command -v docker >/dev/null 2>&1; then
                CONTAINER=$(docker ps --format '{{.Names}}' | grep -E 'wazuh|manager' | head -n1 || echo "")
                if [ -n "$CONTAINER" ]; then
                  echo "$EVENT" | docker exec -i "$CONTAINER" /var/ossec/bin/wazuh-logtest 2>&1 | grep -E "Phase 3|id:|Alert" || true
                fi
              fi
            fi
          fi

      - name: Record validation result
        env:
          WAZUH_API_URL: https://localhost:55000
          WAZUH_API_USER: wazuh-wui
          WAZUH_API_PASS_FILE: /home/ctum/.wazuh-api-pass
        run: |
          set -euo pipefail
          mkdir -p /tmp/attack_results
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat <<EOF > /tmp/attack_results/result.json
          {
            "detection_id": "$RESOLVED_DET_ID",
            "requested_id": "${{ github.event.inputs.detection_id }}",
            "rule_id": "$RULE_ID",
            "technique": "$TECHNIQUE",
            "target": "$TARGET",
            "status": "validated",
            "timestamp": "$TIMESTAMP"
          }
          EOF
          cat /tmp/attack_results/result.json

      - name: Run attack cleanup
        if: always()
        run: |
          if [ -n "${CLEANUP:-}" ]; then
            echo "Running cleanup: $CLEANUP"
          fi

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.event.inputs.detection_id }}
          path: /tmp/attack_results/
